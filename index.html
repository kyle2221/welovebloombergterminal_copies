<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608;--panel:#0a0c10;--panel2:#0e1117;--line:#1c2029;--line2:#262b36;
  --hdr:#132038;--hdr2:#0c1524;--hover:#15233a;
  --amber:#ffa62b;--amber2:#ff8f1f;--amberdim:#6b4a1c;--txt:#e4e7ec;--dim:#7d8594;--faint:#4a505c;--yel:#ffd84d;
  --up:#21d07a;--dn:#ff4d5e;--upbg:rgba(33,208,122,.14);--dnbg:rgba(255,77,94,.14);--blue:#5aa9ff;
  --go:#149a4a;--cancel:#c8283a;
  --mono:"JetBrains Mono","IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12px/1.4 var(--mono);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1200px 500px at 50% -200px,#101828 0%,var(--bg) 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--amber);color:#000}
*{scrollbar-width:thin;scrollbar-color:#2a303b transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#262c36;border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#3a4250}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;background:linear-gradient(#0e1219,#0a0d12);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;color:var(--txt);font-size:13px}
.brand .logo{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,var(--amber),#ff6a00);color:#000;font-size:14px;box-shadow:0 0 14px rgba(255,140,0,.35)}
.brand em{font-style:normal;color:var(--amber)}
.launch{display:flex;gap:3px;padding-left:12px;border-left:1px solid var(--line2);overflow:hidden}
.launch button{padding:3px 8px;border-radius:var(--r);color:var(--dim);font-size:11px;font-weight:500;letter-spacing:.04em;transition:color .15s,background .15s}
.launch button:hover{color:var(--amber);background:#161b24}
#mkts{display:flex;gap:6px;margin-left:auto}
.mkt{display:flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line2);border-radius:20px;font-size:11px;color:var(--dim)}
.mkt i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.mkt.open i{background:var(--up);box-shadow:0 0 6px var(--up)}.mkt.ext i{background:var(--yel)}
.mkt.open{color:var(--txt)}
#clocks{display:flex;gap:12px;color:var(--dim);font-size:11px}
#clocks b{color:var(--txt);font-weight:500}
#conn{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);cursor:help;font-size:11px;font-weight:700;letter-spacing:.06em}
#conn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
#conn.live{border-color:rgba(33,208,122,.4);color:var(--up);background:var(--upbg)}
#conn.live::before{animation:pulse 2s infinite}
#conn.off{border-color:rgba(255,77,94,.4);color:var(--dn);background:var(--dnbg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(33,208,122,.6)}70%{box-shadow:0 0 0 6px rgba(33,208,122,0)}100%{box-shadow:0 0 0 0 rgba(33,208,122,0)}}
.layouts{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.layouts button{padding:3px 9px;color:var(--dim);font-size:11px}
.layouts button+button{border-left:1px solid var(--line2)}
.layouts button:hover{color:var(--txt)}
.layouts button.on{color:#000;background:var(--amber)}

/* ---------- panels ---------- */
#grid{flex:1;display:grid;gap:6px;padding:6px;min-height:0}
#grid.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#grid.l2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
#grid.l1{grid-template-columns:1fr;grid-template-rows:1fr}
#grid.l2 .panel:nth-child(n+3),#grid.l1 .panel:not(.active){display:none}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
.panel.active{border-color:rgba(255,143,31,.55);box-shadow:0 0 0 1px rgba(255,143,31,.18),0 6px 24px rgba(0,0,0,.55)}
.phdr{position:relative;display:flex;align-items:center;gap:8px;height:34px;flex:0 0 auto;background:linear-gradient(#141821,#0f1218);border-bottom:1px solid var(--line);padding:0 6px}
.pnum{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;color:var(--dim);background:#1b202a;font-weight:700;font-size:11px}
.panel.active .pnum{background:var(--amber);color:#000}
.cmdwrap{position:relative;flex:0 1 280px;min-width:110px;display:flex;align-items:center}
.cmdwrap::before{content:"›";position:absolute;left:8px;color:var(--amber);font-weight:700;pointer-events:none}
.cmd{width:100%;background:#07080b;border:1px solid var(--line2);border-radius:var(--r);color:var(--amber);padding:4px 8px 4px 20px;text-transform:uppercase;outline:none;caret-color:var(--amber);transition:border-color .15s,box-shadow .15s}
.cmd:focus{border-color:var(--amber2);box-shadow:0 0 0 3px rgba(255,143,31,.14)}
.cmd::placeholder{color:#57493a;text-transform:none}
.ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt);font-weight:500}
.ptitle .fn{display:inline-block;color:#1a1300;background:var(--yel);padding:1px 6px;border-radius:3px;margin-right:8px;font-weight:700;font-size:11px}
.ptitle .dim{font-weight:400}
.pbtn{display:grid;place-items:center;width:24px;height:22px;color:var(--dim);border:1px solid var(--line2);border-radius:var(--r);font-size:11px;transition:all .15s}
.pbtn:hover{color:var(--amber);border-color:var(--amberdim);background:#1a1510}
.pmsg{display:none;padding:4px 10px;background:linear-gradient(90deg,rgba(255,77,94,.16),rgba(255,77,94,.04));color:#ff9aa4;border-bottom:1px solid rgba(255,77,94,.25);font-size:11px}
.pmsg.show{display:block}.pmsg.info{background:linear-gradient(90deg,rgba(90,169,255,.16),rgba(90,169,255,.04));color:#a9d2ff;border-color:rgba(90,169,255,.25)}
.pbody{flex:1;overflow:auto;position:relative;min-height:0}
.ac{position:absolute;top:30px;left:34px;z-index:20;min-width:380px;max-width:92%;background:#0d1016;border:1px solid var(--amberdim);border-radius:6px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.6);overflow:hidden;padding:3px 0}
.ac.show{display:block}
.ac div{padding:4px 10px;cursor:pointer;display:flex;gap:12px;white-space:nowrap;overflow:hidden}
.ac div.sel,.ac div:hover{background:var(--hover)}
.ac .k{color:var(--amber);min-width:130px}.ac .d{color:var(--dim);overflow:hidden;text-overflow:ellipsis}

/* ---------- content ---------- */
.pad{padding:8px 10px}
.h{color:var(--amber);font-weight:700;letter-spacing:.03em}
.dim{color:var(--dim)}.yel{color:var(--yel)}.amb{color:var(--amber)}.blu{color:var(--blue)}
.up{color:var(--up)}.dn{color:var(--dn)}
.lv[data-f="pct"].up::before,.lv[data-f="chg"].up::before{content:"▲";font-size:8px;margin-right:3px;vertical-align:1px}
.lv[data-f="pct"].dn::before,.lv[data-f="chg"].dn::before{content:"▼";font-size:8px;margin-right:3px;vertical-align:1px}
.bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.bar .lbl{color:var(--dim);margin-left:6px}
.tab{padding:2px 9px;border:1px solid var(--line2);border-radius:var(--r);color:var(--dim);font-size:11px;transition:all .12s}
.tab:hover{color:var(--txt);border-color:#3a414e;background:#141922}
.tab.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.btn{padding:3px 12px;border:1px solid var(--line2);border-radius:var(--r);color:var(--txt);transition:all .12s}
.btn:hover{border-color:var(--amber2);color:var(--amber)}
.btn.buy{background:rgba(33,208,122,.12);border-color:rgba(33,208,122,.5);color:var(--up);font-weight:700}.btn.buy:hover{background:rgba(33,208,122,.25)}
.btn.sell{background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.5);color:var(--dn);font-weight:700}.btn.sell:hover{background:rgba(255,77,94,.25)}
.inp{background:#07080b;color:var(--amber);border:1px solid var(--line2);border-radius:var(--r);padding:3px 7px;outline:none}
.inp:focus{border-color:var(--amber2)}
select.inp{color:var(--txt)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;z-index:1;background:#101725;color:#9fb3d1;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:5px 8px;white-space:nowrap;border-bottom:1px solid #22324d}
td{padding:3px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #12151b}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
th.l,td.l{text-align:left}
tr.grp td{background:linear-gradient(90deg,#15203a,#0c1220 60%)!important;color:var(--amber);font-weight:700;text-align:left;padding:5px 8px;border-left:2px solid var(--amber);letter-spacing:.05em;text-transform:uppercase;font-size:11px}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--hover)!important}
td.n{color:var(--faint);width:1%;font-size:11px}
tr.clk:hover td.n{color:var(--yel)}
.name{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:#c9ced8}
.lv{transition:background-color .8s ease-out;border-radius:2px;padding:0 2px}
.fu{background-color:rgba(33,208,122,.35)!important;transition:none}
.fd{background-color:rgba(255,77,94,.35)!important;transition:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kv .k{color:var(--dim);white-space:nowrap}.kv .v{text-align:right;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.box>.t{color:var(--amber);border-bottom:1px solid var(--line);margin:-2px 0 8px;padding-bottom:6px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px}
.menu a{padding:3px 6px;cursor:pointer;border-radius:var(--r);transition:background .12s}.menu a:hover{background:var(--hover)}
.menu a b{color:var(--yel);font-weight:500;margin-right:6px}
.big{font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:10px;padding:10px 12px;border-radius:6px;background:linear-gradient(135deg,#121826,#0b0e14);border:1px solid var(--line)}
.chartwrap{position:relative;height:100%;min-height:180px}
canvas.chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.gp{display:flex;flex-direction:column;height:100%}
.gp .chartwrap{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:5px 10px;font-size:11px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.news-row{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid #12151b;cursor:pointer;transition:background .12s}
.news-row:hover{background:var(--hover)}
.news-row .tm{color:var(--dim);flex:0 0 auto;width:78px;font-size:11px;padding-top:1px}
.news-row .src{flex:0 0 auto;align-self:flex-start;min-width:52px;text-align:center;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(90,169,255,.12);color:var(--blue)}
.news-row .hl{color:var(--txt);flex:1;min-width:0}
.news-row .hl small{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.news-row.fresh .hl{color:var(--yel)}
.heat{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.heat .sec{flex:1 1 auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:160px;background:#0b0d12}
.heat .sec>.t{background:#121620;color:var(--amber);padding:3px 6px;font-size:11px;font-weight:700}
.heat .tiles{display:flex;flex-wrap:wrap;flex:1;gap:1px;padding:1px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;min-height:48px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);overflow:hidden;transition:filter .12s,transform .12s}
.tile:hover{filter:brightness(1.3);transform:scale(1.02)}
.tile b{font-size:12px}.tile span{font-size:11px;opacity:.9}
.range{position:relative;height:6px;background:linear-gradient(90deg,rgba(255,77,94,.45),#2a2f39,rgba(33,208,122,.45));border-radius:4px;margin:5px 0 8px}
.range i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.distbar{display:flex;height:14px;margin:4px 0 8px;border-radius:4px;overflow:hidden}
.distbar div{height:100%}
.empty{padding:28px;color:var(--dim);text-align:center}
.spin::after{content:"LOADING";letter-spacing:.2em;animation:blink 1s steps(2) infinite;color:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.ticket{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);background:linear-gradient(#0c0f14,#08090c);flex:0 0 auto}
#keys{display:flex;gap:4px;padding:5px 8px;overflow-x:auto;white-space:nowrap}
.key{padding:2px 8px;background:linear-gradient(#ffe066,#f2c200);color:#1a1300;font-weight:700;border-radius:4px;font-size:11px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transition:transform .08s,filter .12s}
.key:hover{filter:brightness(1.1)}.key:active{transform:translateY(1px)}
.key.g{background:linear-gradient(#22b35c,#138a43);color:#fff}.key.r{background:linear-gradient(#e0394b,#b01e2f);color:#fff}.key.m{background:linear-gradient(#dfe3ea,#b9bfca)}
.key small{font-weight:500;opacity:.6;margin-right:4px}
#tape{overflow:hidden;height:26px;border-top:1px solid var(--line);position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
#tapeInner{position:absolute;white-space:nowrap;animation:tape 140s linear infinite;line-height:25px}
#tape:hover #tapeInner{animation-play-state:paused}
#tapeInner span.it{margin-right:10px;padding-right:12px;border-right:1px solid var(--line2);cursor:pointer}
#tapeInner span.it b{color:var(--amber);font-weight:500;margin-right:6px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- maps & geospatial ---------- */
.geo{display:flex;flex-direction:column;height:100%}
.mapwrap{position:relative;flex:1;min-height:260px}
.map{position:absolute;inset:0;background:#0b0e14}
.geostat{display:flex;flex-wrap:wrap;gap:3px 16px;padding:5px 10px;border-top:1px solid var(--line);font-size:11px;background:var(--panel2)}
.geolist{flex:0 0 auto;max-height:32%;overflow:auto;border-top:1px solid var(--line)}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);cursor:pointer;padding:2px 7px;border:1px solid var(--line2);border-radius:var(--r);font-size:11px;user-select:none}
label.chk:has(input:checked){color:var(--txt);border-color:var(--amberdim);background:#1a1510}
label.chk input{accent-color:var(--amber);margin:0}
.maplegend{position:absolute;left:8px;bottom:22px;z-index:500;background:rgba(10,12,16,.88);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:10px;line-height:1.7;pointer-events:none;max-width:70%}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.acicon{background:none;border:0}
.acicon div{width:18px;height:18px;filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
.map.leaflet-container{background:#0b0e14;font:11px var(--mono)}
.leaflet-tooltip{background:rgba(10,12,16,.96);color:var(--txt);border:1px solid var(--amberdim);border-radius:5px;font:11px/1.5 var(--mono);box-shadow:0 6px 18px rgba(0,0,0,.6);white-space:nowrap}
.leaflet-tooltip-top:before{border-top-color:var(--amberdim)}
.leaflet-tooltip b{color:var(--amber)}
.leaflet-control-attribution{background:rgba(10,12,16,.75)!important;color:var(--dim)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--blue)!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:0 4px 12px rgba(0,0,0,.5)!important}
.leaflet-bar a{background:#141821!important;color:var(--txt)!important;border-color:var(--line2)!important}
.leaflet-bar a:hover{background:#1c2230!important;color:var(--amber)!important}
.satgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.satcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel2);transition:border-color .15s,transform .15s}
.satcard:hover{border-color:var(--amber2);transform:translateY(-2px)}
.sattile{position:relative;height:150px;overflow:hidden;background:#111}
.satc{position:absolute;left:50%;top:50%;width:0;height:0}
.satc img{position:absolute;width:256px;height:256px;max-width:none}
.satn{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:var(--yel);font-size:10px;padding:0 5px;border-radius:3px}
.satcard .cap{padding:6px 9px}
.satcard .cap b{color:var(--amber)}.satcard .cap small{display:block;color:var(--dim)}
.hbar{display:flex;align-items:center;gap:8px;margin:3px 0}
.hbar .nm{width:150px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:10px;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:2px}
.hbar .v{color:var(--dim);font-size:11px}

/* ---------- edge widgets ---------- */
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.kpi .big{margin:2px 0}
.spark{position:relative;height:44px;margin-top:4px}
.spark canvas.chart{cursor:default}
.predgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.pred{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;transition:border-color .15s}
.pred:hover{border-color:var(--amber2)}
.pred .pt{font-weight:500;margin-bottom:6px;white-space:normal;line-height:1.35}
.src{display:inline-block;font-size:9px;font-weight:700;padding:0 5px;border-radius:3px;background:rgba(90,169,255,.15);color:var(--blue);vertical-align:1px}
.src.k{background:rgba(33,208,122,.15);color:var(--up)}
.po{display:flex;align-items:center;gap:8px;margin:3px 0}
.po .pn{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9ced8}
.po .pb{flex:1;height:8px;background:#1b2029;border-radius:4px;overflow:hidden}
.po .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber))}
.po b{width:44px;text-align:right}
.pv{margin-top:4px;font-size:10px}
.pr1{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #12151b}
.pr1:hover{background:var(--hover)}
.fgbar{position:relative;height:8px;border-radius:4px;margin:8px 0 2px;background:linear-gradient(90deg,#ff4d5e,#ff9f43,#ffd84d,#8fd36a,#21d07a)}
.fgbar i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.fgl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:6px}

@media (max-width:1300px){.launch{display:none}}
@media (max-width:1050px){#mkts{display:none}}
@media (max-width:900px){
  body{overflow:auto}
  #grid.l4,#grid.l2{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(420px,80vh)}
  #grid.l2 .panel:nth-child(n+3){display:flex}
  #clocks span:nth-child(n+2){display:none}
}

  if (ok(cfg.ref)) {
    c.setLineDash([3, 3]); c.strokeStyle = '#6b7280'; c.beginPath(); c.moveTo(pl, Y(cfg.ref)); c.lineTo(pl + pw, Y(cfg.ref)); c.stroke(); c.setLineDash([]);
  }
  // volume
  if (cfg.v) {
    const vmax = Math.max(...cfg.v.filter(ok), 1);
    const bw = Math.max(1, pw / N * 0.7);
    const base = pt + ph + 4 + vh;
    const cl = cfg.s[0].d;
    for (let i = 0; i < N; i++) {
      if (!ok(cfg.v[i])) continue;
      const hgt = cfg.v[i] / vmax * vh;
      c.fillStyle = i > 0 && cl[i] < cl[i - 1] ? 'rgba(255,67,67,.55)' : 'rgba(31,224,106,.5)';
      c.fillRect(X(i) - bw / 2, base - hgt, bw, hgt);
    }
  }
  // series
  if (cfg.candle) {
    const { o, h, l } = cfg.candle, cl = cfg.s[0].d;
    const bw = Math.max(1, pw / N * 0.65);
    for (let i = 0; i < N; i++) {
      if (!ok(o[i]) || !ok(cl[i])) continue;
      const up = cl[i] >= o[i];
      c.strokeStyle = c.fillStyle = up ? '#1fe06a' : '#ff4343';
      c.beginPath(); c.moveTo(X(i), Y(h[i])); c.lineTo(X(i), Y(l[i])); c.stroke();
      const y1 = Y(Math.max(o[i], cl[i])), y2 = Y(Math.min(o[i], cl[i]));
      c.fillRect(X(i) - bw / 2, y1, bw, Math.max(1, y2 - y1));
    }
  }
  cfg.s.forEach((s, si) => {
    if (cfg.candle && si === 0) return;
    c.strokeStyle = s.c; c.lineWidth = s.w || 1.4;
    c.beginPath();
    let pen = false, first = null, lastX = null;
    s.d.forEach((v, i) => {
      if (!ok(v)) { pen = false; return; }
      const x = X(i), y = Y(v);
      if (!pen) { c.moveTo(x, y); pen = true; if (first == null) first = x; } else c.lineTo(x, y);
      lastX = x;
    });
    if (si === 0) { c.shadowColor = s.c + '99'; c.shadowBlur = 8; }
    c.stroke();
    c.shadowBlur = 0;
    if (s.fill && first != null) {
      c.lineTo(lastX, pt + ph); c.lineTo(first, pt + ph); c.closePath();
      const g = c.createLinearGradient(0, pt, 0, pt + ph);
      g.addColorStop(0, s.c + '40'); g.addColorStop(1, s.c + '00');
      c.fillStyle = g; c.fill();
    }
    if (cfg.dots) s.d.forEach((v, i) => { if (ok(v)) { c.fillStyle = s.c; c.beginPath(); c.arc(X(i), Y(v), 3, 0, 7); c.fill(); } });
  });
  // event markers (e.g. insider buys/sells): {i, up, c}
  (cfg.marks || []).forEach(mk => {
    const v = cfg.s[0].d[mk.i];
    if (!ok(v)) return;
    const x = X(mk.i), y = Y(v) + (mk.up ? 12 : -12);
    c.fillStyle = mk.c || (mk.up ? '#21d07a' : '#ff4d5e');
    c.strokeStyle = '#000'; c.lineWidth = 1;
    c.beginPath();
    if (mk.up) { c.moveTo(x, y - 6); c.lineTo(x - 5, y + 3); c.lineTo(x + 5, y + 3); }
    else { c.moveTo(x, y + 6); c.lineTo(x - 5, y - 3); c.lineTo(x + 5, y - 3); }
    c.closePath(); c.fill(); c.stroke();
  });
  // last value tags
  c.textAlign = 'left'; c.textBaseline = 'middle';
  cfg.s.forEach(s => {
    if (s.noTag) return;
    let v = null; for (let i = s.d.length - 1; i >= 0; i--) if (ok(s.d[i])) { v = s.d[i]; break; }
    if (v == null) return;
    const y = Math.min(Math.max(Y(v), pt + 7), pt + ph - 7);
    c.fillStyle = s.c; c.fillRect(pl + pw + 1, y - 8, pr - 2, 16);
    c.fillStyle = '#000'; c.fillText(yf(v), pl + pw + 5, y);
  });
  // crosshair
  const hi = cv._hi;
  if (hi != null && hi >= 0 && hi < N) {
    const x = X(hi);
    c.strokeStyle = '#9aa4b2'; c.setLineDash([2, 3]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, pt); c.lineTo(x, pt + ph + vh); c.stroke();
    const v0 = cfg.s[0].d[hi];
    if (ok(v0)) { c.beginPath(); c.moveTo(pl, Y(v0)); c.lineTo(pl + pw, Y(v0)); c.stroke(); }
    c.setLineDash([]);
    const lines = [cfg.xl ? cfg.xl(hi) : cfg.x[hi]];
    if (cfg.candle) { const k = cfg.candle; lines.push(`O ${yf(k.o[hi])}  H ${yf(k.h[hi])}`, `L ${yf(k.l[hi])}  C ${yf(cfg.s[0].d[hi])}`); }
    cfg.s.forEach(s => { if (!(cfg.candle && s === cfg.s[0])) lines.push(`${s.n || ''} ${ok(s.d[hi]) ? yf(s.d[hi]) : '—'}`.trim()); });
    if (cfg.v && ok(cfg.v[hi])) lines.push('Vol ' + big(cfg.v[hi]));
    const bw = Math.max(...lines.map(t => c.measureText(t).width)) + 12, bh = lines.length * 14 + 6;
    const bx = x + 10 + bw > pl + pw ? x - bw - 10 : x + 10;
    c.fillStyle = 'rgba(10,14,20,.92)'; c.strokeStyle = '#ffa028'; c.fillRect(bx, pt + 4, bw, bh); c.strokeRect(bx + .5, pt + 4.5, bw, bh);
    c.textBaseline = 'top'; c.fillStyle = '#e6e6e6';
    lines.forEach((t, i) => { c.fillStyle = i === 0 ? '#ffa028' : '#e6e6e6'; c.fillText(t, bx + 6, pt + 8 + i * 14); });
  }
}
function mountChart(cv, cfg) {
  cv._cfg = cfg;
  if (!cv._init) {
    cv._init = true;
    const move = e => {
      const r = cv.getBoundingClientRect();
      const N = cv._cfg.x.length, pw = r.width - 72;
      cv._hi = Math.max(0, Math.min(N - 1, Math.round((e.clientX - r.left - 6) / pw * (N - 1))));
      drawChart(cv);
    };
    cv.addEventListener('mousemove', move);
    cv.addEventListener('mouseleave', () => { cv._hi = null; drawChart(cv); });

  }

}
function sma(a, n) {
  const out = new Array(a.length).fill(null);
  let s = 0;
  for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) out[i] = s / n; }
  return out;
}

   Paper-trading portfolio & watchlist (stored locally)
   ===================================================================== */
const START_CASH = 1_000_000;
let PF = store.get('pf', null) || { cash: START_CASH, pos: {}, fills: [], realized: 0 };
let WL = store.get('wl', null) || ['^GSPC', '^IXIC', 'AAPL', 'MSFT', 'NVDA', 'AMZN', 'GOOGL', 'META', 'TSLA', 'EURUSD=X', 'GC=F', 'CL=F', 'BTC-USD'];
const savePF = () => store.set('pf', PF), saveWL = () => store.set('wl', WL);
async function trade(side, y, qty) {
  qty = Math.floor(Math.abs(qty));
  if (!qty) throw new Error('Quantity must be a positive whole number');
  if (isYield(y)) throw new Error('Yield indices are not tradable');
  const q = await ensureQuote(y);
  if (!q) throw new Error('No live price for ' + y);
  const px = side === 'BUY' ? (q.ask || q.price) : (q.bid || q.price);
  const signed = side === 'BUY' ? qty : -qty;
  if (side === 'BUY' && px * qty > PF.cash + 1e-6) throw new Error(`Insufficient cash: need ${nf(px * qty)}, have ${nf(PF.cash)}`);
  const pos = PF.pos[y] || { q: 0, avg: 0 };
  if (pos.q === 0 || Math.sign(pos.q) === Math.sign(signed)) {
    pos.avg = (pos.avg * Math.abs(pos.q) + px * qty) / (Math.abs(pos.q) + qty);
    pos.q += signed;
  } else {
    const closing = Math.min(qty, Math.abs(pos.q));
    PF.realized += (px - pos.avg) * closing * Math.sign(pos.q);
    const nq = pos.q + signed;
    if (Math.sign(nq) !== Math.sign(pos.q) && nq !== 0) pos.avg = px;
    pos.q = nq;
  }
  if (pos.q === 0) delete PF.pos[y]; else PF.pos[y] = pos;
  PF.cash -= signed * px;
  PF.fills.unshift({ t: Date.now(), side, y, qty, px });
  PF.fills = PF.fills.slice(0, 500);
  savePF();
  return { px, qty, side };
}

        h += `<div class="sec" style="flex-grow:${Math.max(1, Math.sqrt(cap / 1e11))}"><div class="t">${esc(s)} <span class="${cls(sp)}">${pc(sp)}</span></div><div class="tiles">`;
        for (const y of [...list].sort((a, b) => (Q[b]?.mcap || 0) - (Q[a]?.mcap || 0))) {
          const q = Q[y];
          const w = Math.max(1, Math.sqrt((q?.mcap || 5e10) / 5e10));
          h += `<div class="tile" data-cmd="${esc(disp(y))} GP" title="${esc(nameOf(y))}" style="flex:${w} 1 ${Math.round(46 * w)}px;background:${heatColor(q?.pct)}"><b>${esc(y)}</b><span>${pc(q?.pct)}</span></div>`;
        }
        h += '</div></div>';
      }
      el.querySelector('.heat').innerHTML = h;
    };
    draw();
    p.tick = draw;
  },
};

const FXC_CCY = ['USD', 'EUR', 'JPY', 'GBP', 'CHF', 'CAD', 'AUD', 'NZD', 'CNH'];
const FXC_SRC = { EUR: ['EURUSD=X', 1], GBP: ['GBPUSD=X', 1], AUD: ['AUDUSD=X', 1], NZD: ['NZDUSD=X', 1], JPY: ['JPY=X', -1], CHF: ['CHF=X', -1], CAD: ['CAD=X', -1], CNH: ['CNH=X', -1] };
function usdPer(c, f = 'price') {
  if (c === 'USD') return 1;

}

    const cv = $('canvas', el);
    const intraday = /m$/.test(rg[2]);
    const load = () => api(`chart?symbol=${encodeURIComponent(y)}&range=${rg[1]}&interval=${rg[2]}`).then(c => {
      if (!p.alive(el)) return;
      const off = c.meta.gmtoffset;
      const x = c.t.map(t => intraday ? (rg[1] === '1d' ? fT(xd(t, off)) : fD(xd(t, off)).slice(0, 5) + ' ' + fT(xd(t, off))) : fD(xd(t, off)));
      const style = store.get('gp.style', 'LINE'), useMa = store.get('gp.ma', true) && !intraday;
      const s = [{ n: 'Px', d: c.c, c: COLORS[0], fill: style === 'LINE', w: 1.6 }];
      const leg = [`<span><i style="background:${COLORS[0]}"></i>Last Price</span>`];
      if (useMa) {
        [[50, COLORS[1]], [200, COLORS[2]]].forEach(([n, col]) => { if (c.c.length > n) { s.push({ n: 'SMA' + n, d: sma(c.c, n), c: col, w: 1, noTag: false }); leg.push(`<span><i style="background:${col}"></i>SMA ${n}</span>`); } });
      }
      const valid = c.c.filter(ok);
      const hi = Math.max(...valid), lo = Math.min(...valid), first = valid[0], last = valid[valid.length - 1];
      const base = rg[1] === '1d' ? c.meta.prev : first;
      $('.lg', el).innerHTML = leg.join('') + `<span class="dim">${esc(c.meta.exch || '')} · ${esc(c.meta.ccy || '')} · ${esc(c.meta.tz || '')}</span>`;
      $('.stats', el).innerHTML = `Range ${rg[0]}: Hi ${nf(hi, dec(y, hi))} Lo ${nf(lo, dec(y, lo))} · Chg <span class="${cls(last - base)}">${sgn(last - base, dec(y, last))} (${pc((last / base - 1) * 100)})</span>`;
      mountChart(cv, {
        x, s, v: isEquity(y) && c.v.some(v => v) ? c.v : null, ref: rg[1] === '1d' ? c.meta.prev : null,
        candle: style === 'CANDLE' ? { o: c.o, h: c.h, l: c.l } : null,
        yf: v => nf(v, dec(y, v)),
        xl: i => intraday ? fD(xd(c.t[i], off)) + ' ' + fT(xd(c.t[i], off)) : fD(xd(c.t[i], off)),
      });
    }).catch(e => { if (p.alive(el)) { p.msg('Chart: ' + e.message); cv._cfg = { x: [], s: [] }; drawChart(cv); } });
    load();
    let n = 0;
    p.tick = () => { if (intraday && ++n % 12 === 0) load(); };
  },
};

const FA_ROWS = [['TotalRevenue', 'Revenue', big], ['GrossProfit', 'Gross Profit', big], ['OperatingIncome', 'Operating Income', big], ['EBITDA', 'EBITDA', big], ['NetIncome', 'Net Income', big], ['DilutedEPS', 'Diluted EPS', v => nf(v, 2)], ['DilutedAverageShares', 'Diluted Shares', big], ['OperatingCashFlow', 'Operating Cash Flow', big], ['CapitalExpenditure', 'CapEx', big], ['FreeCashFlow', 'Free Cash Flow', big], ['TotalAssets', 'Total Assets', big], ['TotalDebt', 'Total Debt', big], ['CashAndCashEquivalents', 'Cash & Equivalents', big], ['StockholdersEquity', 'Shareholders Equity', big]];
FN.FA = {
  d: 'Financial analysis (income, cash flow, balance sheet)', cat: 'sec', sec: true,
  r(p, y, arg) {
    p.syms = [y];
    const per = arg === 'quarterly' ? 'quarterly' : 'annual';
    return `<div class="bar"><button class="tab ${per === 'annual' ? 'on' : ''}" data-go="FA|annual">ANNUAL</button><button class="tab ${per === 'quarterly' ? 'on' : ''}" data-go="FA|quarterly">QUARTERLY</button><span class="lbl">${esc(nameOf(y))}</span> ${L(y, 'price')} ${L(y, 'pct')}</div><div class="res"></div>`;
  },
  m(p, el, y, arg) {
    const per = arg === 'quarterly' ? 'quarterly' : 'annual';
    loading(el, '.res');
    cachedApi('fin:' + y, 3600e3, 'fin?symbol=' + encodeURIComponent(y)).then(f => {
      if (!p.alive(el)) return;
      const d = f[per];
      const dates = [...new Set(Object.values(d).flat().map(x => x.d))].sort().slice(per === 'annual' ? -6 : -8);
      if (!dates.length) { $('.res', el).innerHTML = '<div class="empty">No financial statements available for this security.</div>'; return; }
      const val = (k, dt) => d[k]?.find(x => x.d === dt)?.v ?? null;
      let h = `<table><thead><tr><th class="l">${per === 'annual' ? 'Fiscal Year' : 'Quarter'} (${esc(Q[y]?.ccy || '')})</th>${dates.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>`;
      FA_ROWS.forEach(([k, n, fm]) => { if (d[k]) h += `<tr><td class="l">${n}</td>${dates.map(dt => { const v = val(k, dt); return `<td class="${v < 0 ? 'dn' : ''}">${ok(v) ? fm(v) : '—'}</td>`; }).join('')}</tr>`; });
      h += `<tr class="grp"><td colspan="${dates.length + 1}">Ratios & Growth</td></tr>`;
      const ratio = (n, fn) => `<tr><td class="l">${n}</td>${dates.map((dt, i) => { const v = fn(dt, i); return `<td class="${cls(v)}">${ok(v) ? nf(v, 1) + '%' : '—'}</td>`; }).join('')}</tr>`;
      const mg = k => dt => { const a = val(k, dt), r = val('TotalRevenue', dt); return ok(a) && r ? a / r * 100 : null; };
      h += ratio('Gross Margin', mg('GrossProfit')) + ratio('Operating Margin', mg('OperatingIncome')) + ratio('Net Margin', mg('NetIncome')) + ratio('FCF Margin', mg('FreeCashFlow'));
      const lag = per === 'annual' ? 1 : 4;
      const gr = k => (dt, i) => { if (i < lag) return null; const a = val(k, dt), b = val(k, dates[i - lag]); return ok(a) && ok(b) && b ? (a / Math.abs(b) - Math.sign(b)) * 100 : null; };
      h += ratio(per === 'annual' ? 'Revenue Growth YoY' : 'Revenue Growth YoY (vs Q-4)', gr('TotalRevenue')) + ratio('EPS Growth YoY', gr('DilutedEPS'));
      h += ratio('Return on Equity', dt => { const a = val('NetIncome', dt), e = val('StockholdersEquity', dt); return ok(a) && e ? a / e * 100 * (per === 'annual' ? 1 : 4) : null; });

    }).catch(e => p.alive(el) && fail(el, e, '.res'));
  },
};

    dark: tl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', attribution: '© OpenStreetMap contributors © CARTO' }),

    night: tl('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png', { maxNativeZoom: 8, maxZoom: 13, attribution: 'NASA Black Marble (VIIRS night lights)' }),
  };
  let baseLayer = bases[st.base] || bases.dark;
  baseLayer.addTo(map);

  const G = { flights: L.layerGroup(), ships: L.layerGroup(), lanes: L.layerGroup(), energy: L.layerGroup(), bases: L.layerGroup() };
  const data = { flights: null, ships: null, bases: null };
  const status = { flights: '', ships: '', bases: '' };
  const tip = (m, html) => m.bindTooltip(html, { direction: 'top', offset: [0, -6], sticky: false });

  const on = k => st.layers.includes(k);

  };
  const time = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const planeIcons = {};

  let flSeq = 0, shSeq = 0, bsSeq = 0;

  // controls
  $('[data-preset]', el).onchange = e => { const x = MAP_PRESETS.find(q => q[0] === e.target.value); if (x) { st.preset = x[0]; map.setView([x[2], x[3]], x[4]); } };

}

function satThumb(lat, lon, z) {
  const n = 2 ** z, xf = (lon + 180) / 360 * n, lr = lat * Math.PI / 180, yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  const x0 = Math.floor(xf - 0.5), y0 = Math.floor(yf - 0.5);
  let h = '<div class="satc">';
  for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) {
    h += `<img loading="lazy" alt="" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y0 + dy}/${x0 + dx}" style="left:${Math.round((dx - (xf - x0)) * 256)}px;top:${Math.round((dy - (yf - y0)) * 256)}px">`;
  }
  return h + '</div>';
}

// ---------------------------------------------------------------- INSD: company insider trades
function yInsiderTx(h) {
  return (h.insiderTransactions?.transactions || []).map(t => {
    const text = t.transactionText || '';
    let code = 'A', label = 'Grant / exercise';
    if (/^Sale/i.test(text)) { code = 'S'; label = 'Sale'; }
    else if (/^(Purchase|Buy)/i.test(text)) { code = 'P'; label = 'Purchase'; }
    else if (/Gift/i.test(text)) { code = 'G'; label = 'Gift'; }
    else if (/Exercise|Conversion/i.test(text)) { code = 'M'; label = 'Option exercise'; }
    const pm = text.match(/price\s+([\d.,]+)(?:\s*-\s*([\d.,]+))?/i);
    const p1 = pm ? Number(pm[1].replace(/,/g, '')) : null, p2 = pm && pm[2] ? Number(pm[2].replace(/,/g, '')) : p1;
    const shares = rv(t.shares), value = rv(t.value);
    return { date: rv(t.startDate), name: t.filerName, role: t.filerRelation, code, label, text, shares, value, price: p1 ? (p1 + p2) / 2 : (value && shares ? value / shares : null), own: t.ownership };
  });
}

// ---------------------------------------------------------------- OMON: options monitor
function maxPain(calls, puts) {
  const strikes = [...new Set([...calls, ...puts].map(c => c.k))].sort((a, b) => a - b);
  let best = null, bestV = Infinity;
  for (const K of strikes) {
    let v = 0;
    for (const c of calls) v += c.oi * Math.max(0, K - c.k);
    for (const q of puts) v += q.oi * Math.max(0, q.k - K);
    if (v < bestV) { bestV = v; best = K; }
  }
  return best;
}

      const ox = $('#ox', el); if (ox) ox.onchange = () => ox.value && p.go('OMON', y, ox.value, false);
      const spot = d.spot, all = [...d.calls, ...d.puts];

const FOMC = ['2026-01-28', '2026-03-18', '2026-04-29', '2026-06-17', '2026-07-29', '2026-09-16', '2026-10-28', '2026-12-09'];

  },

    const months = [];
    const d0 = new Date();
    for (let i = 0; i < 14; i++) { const m = new Date(d0.getFullYear(), d0.getMonth() + i, 1); months.push({ y: m.getFullYear(), m: m.getMonth(), sym: `ZQ${MONTH_CODES[m.getMonth()]}${String(m.getFullYear()).slice(2)}.CBT`, label: m.toLocaleDateString('en-US', { month: 'short' }) + ' ' + String(m.getFullYear()).slice(2) }); }
    Promise.all([api('quotes?symbols=' + encodeURIComponent(months.map(m => m.sym).join(','))), cachedApi('macro', 1800e3, 'macro').catch(() => ({}))]).then(([qs, mac]) => {
      if (!p.alive(el)) return;
      const effr = mac.effr?.length ? mac.effr[mac.effr.length - 1] : null;
      const rows = months.map(m => ({ ...m, q: qs[m.sym] })).filter(m => m.q && ok(m.q.price) && m.q.price > 80).map(m => ({ ...m, rate: 100 - m.q.price }));
      if (!rows.length) { $('.res', el).innerHTML = '<div class="empty">Fed funds futures quotes are unavailable right now.</div>'; return; }
      const base = effr ? effr.v : rows[0].rate;
      // Meeting-by-meeting probabilities (CME FedWatch method) for upcoming 2026 meetings
      let pre = base;
      const meet = FOMC.filter(d => Date.parse(d) > Date.now() - 864e5).map(d => {
        const dt = new Date(d + 'T12:00:00Z'), y = dt.getUTCFullYear(), mo = dt.getUTCMonth(), N = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate(), day = dt.getUTCDate();

      ]) + `<div class="dim" style="margin-top:6px">Implied rate = 100 − futures price. Meeting odds use the CME FedWatch method on 30-day fed funds futures (CBOT ZQ).</div>`;
      mountChart($('canvas', el), { x: rows.map(r => r.label), s: [{ n: 'Implied', d: rows.map(r => r.rate), c: COLORS[0], w: 2, fill: true }], ref: base, dots: true, yf: v => nf(v, 2) + '%' });
      $('.res', el).innerHTML = (meet.length ? `<div class="h" style="margin-bottom:6px">FOMC MEETINGS</div><table><thead><tr><th class="l">Decision</th><th>Rate before</th><th>Implied after</th><th>Priced move</th><th class="l">Reading</th></tr></thead><tbody>${meet.map(m => `<tr><td class="l amb">${m.d}</td><td>${nf(m.pre, 3)}%</td><td>${nf(m.post, 3)}%</td><td class="${cls(m.move)}">${sgn(m.move, 1)} bp</td><td class="l dim">${Math.abs(m.move) < 5 ? 'hold' : `${nf(Math.min(100, Math.abs(m.move) / 25 * 100), 0)}% chance of 25bp ${m.move < 0 ? 'cut' : 'hike'}`}</td></tr>`).join('')}</tbody></table>` : '') +

function trackVessel(s) {
  if (!TRK.find(t => t.mmsi === s.mmsi)) { TRK.push({ mmsi: s.mmsi, name: s.name || String(s.mmsi) }); }
  recordTrail([s]); saveTrk();
}
function recordTrail(ships) {
  for (const s of ships) {
    if (!TRK.find(t => t.mmsi === s.mmsi) || s.lat == null) continue;
    const h = (TRK_HIST[s.mmsi] ||= []), last = h[h.length - 1];
    if (!last || Math.abs(last[1] - s.lat) > 1e-4 || Math.abs(last[2] - s.lon) > 1e-4) h.push([Date.now(), +s.lat.toFixed(5), +s.lon.toFixed(5), s.sog ?? null]);
    if (h.length > 300) h.splice(0, h.length - 300);
    const t = TRK.find(x => x.mmsi === s.mmsi);
    Object.assign(t, { name: s.name || t.name, last: { ...s, seen: Date.now() } });
  }
}

const PANELS = [];

const DEFAULTS = [{ fn: 'EDGE' }, { fn: 'WEI' }, { fn: 'GP', sec: '^GSPC' }, { fn: 'INSB' }];
class Panel {
  constructor(i) {
    this.i = i; this.hist = []; this.syms = []; this.seq = 0; this.cmdHist = store.get('ch' + i, []); this.chi = -1;
    const el = this.el = document.createElement('section');
    el.className = 'panel';
    el.innerHTML = `<div class="phdr"><span class="pnum">${i + 1}</span><div class="cmdwrap"><input class="cmd" spellcheck="false" autocomplete="off" placeholder="Type command, e.g. AAPL US EQUITY GP <GO>"></div><div class="ac"></div><span class="ptitle"></span><button class="pbtn" data-b title="Back (Alt+←)">◀</button><button class="pbtn" data-x title="Maximize">⤢</button></div><div class="pmsg"></div><div class="pbody"></div>`;
    this.inp = $('.cmd', el); this.body = $('.pbody', el); this.ac = $('.ac', el);
    el.addEventListener('mousedown', () => setActive(i));
    $('[data-b]', el).onclick = () => this.back();
    $('[data-x]', el).onclick = () => setLayout($('#grid').classList.contains('l1') ? store.get('layout.prev', 'l4') : 'l1');
    this.body.addEventListener('click', e => {
      const t = e.target.closest('[data-cmd],[data-go],[data-watch]');
      if (!t || t.closest('a[href]') && !t.dataset.cmd) return;
      if (t.dataset.watch) { const y = t.dataset.watch; if (!WL.includes(y)) { WL.push(y); saveWL(); } this.msg(`${disp(y)} added to watchlist (W <GO>)`, true); return; }
      if (t.dataset.go) { const [f, a] = t.dataset.go.split('|'); this.go(f, this.cur?.sec, a, false); return; }
      e.preventDefault(); this.run(t.dataset.cmd);
    });
    this.inp.addEventListener('input', () => this.suggest());
    this.inp.addEventListener('keydown', e => this.key(e));
    this.inp.addEventListener('blur', () => setTimeout(() => this.ac.classList.remove('show'), 150));
  }
  alive(el) { return el.isConnected && el._seq === this.seq; }
  msg(t, info) { const m = $('.pmsg', this.el); m.textContent = t || ''; m.className = 'pmsg' + (t ? ' show' : '') + (info ? ' info' : ''); if (t) { clearTimeout(this._mt); this._mt = setTimeout(() => this.msg(''), 8000); } }
  setTitle() {
    const c = this.cur; if (!c) return;
    const F = FN[c.fn];
    const t = this.title || (c.sec ? `${disp(c.sec)} — ${nameOf(c.sec)}` : F.d);
    $('.ptitle', this.el).innerHTML = `<span class="fn">${esc(c.fn)}</span>${esc(t)}${c.sec ? ` <span class="dim">· ${esc(F.d)}</span>` : ''}`;
  }
  go(fn, sec, arg, push = true) {
    if (push && this.cur) { this.hist.push(this.cur); if (this.hist.length > 50) this.hist.shift(); }
    this.cur = { fn, sec: sec || null, arg: arg ?? null };
    this.render();
    store.set('panel' + this.i, this.cur);
  }
  rerender() { this.render(true); }
  render(keepScroll) {
    const { fn, sec, arg } = this.cur;
    const F = FN[fn];
    const top = this.body.scrollTop;
    if (this.cleanup) { try { this.cleanup(); } catch (e) { console.error(e); } this.cleanup = null; }
    this.seq++; this.syms = []; this.actions = null; this.tick = null; this.title = null;
    const html = F.r(this, sec, arg);
    this.body.innerHTML = html;
    const root = document.createElement('div'); root.style.height = '100%';
    while (this.body.firstChild) root.appendChild(this.body.firstChild);
    root._seq = this.seq; this.body.appendChild(root);
    this.setTitle();
    try { F.m && F.m(this, root, sec, arg); } catch (e) { console.error(e); this.msg(e.message); }
    this.setTitle();
    this.body.scrollTop = keepScroll ? top : 0;
    this.inp.placeholder = sec ? `${disp(sec)} — type function <GO>` : 'Type command, e.g. AAPL US EQUITY GP <GO>';
    requestPoll();
  }
  back() { if (this.hist.length) { this.cur = this.hist.pop(); this.render(); store.set('panel' + this.i, this.cur); } else this.msg('No previous screen', true); }
  async run(raw) {
    const s = String(raw).toUpperCase().replace(/<GO>/g, '').trim();
    if (!s) return;
    this.msg('');
    this.cmdHist = [s, ...this.cmdHist.filter(x => x !== s)].slice(0, 30); store.set('ch' + this.i, this.cmdHist);
    if (/^\d+$/.test(s)) {
      const a = this.actions?.[+s - 1];
      return a ? this.run(a) : this.msg(`No menu item ${s}`);
    }
    const t = s.split(/\s+/);
    if (t[0] === 'MENU' || t[0] === 'BACK') return this.back();
    if (t[0] === 'SATOPEN') return openSat(this, +t[1]);
    if (t[0] === 'BUY' || t[0] === 'SELL') {
      const qi = t.findIndex((x, i) => i > 0 && /^\d+$/.test(x));
      const qty = qi > 0 ? +t[qi] : 0;
      const y = resolve(t.slice(1).filter((_, i) => i + 1 !== qi)) || this.cur?.sec;
      if (!y || !qty) return this.msg('Usage: BUY <qty> <security>   e.g. BUY 100 AAPL');
      try { const r = await trade(t[0], y, qty); this.msg(`FILLED: ${r.side} ${nf(r.qty, 0)} ${disp(y)} @ ${nf(r.px, dec(y, r.px))}`, true); if (this.cur?.fn === 'PORT') this.rerender(); }
      catch (e) { this.msg(e.message); }
      return;
    }
    if (t[0] === 'COMP' && t.length > 1) {
      const list = t.slice(1).map(x => resolve([x])).filter(Boolean);
      return this.go('COMP', list[0], { list: [...new Set(list)], rg: '1Y' });
    }
    if (t[0] === 'N' || t[0] === 'SECF' || t[0] === 'EQS' || t[0] === 'TOP' || t[0] === 'MOST') {
      const rest = t.slice(1).join(' ');
      return this.go(t[0], null, t[0] === 'EQS' ? rest.toLowerCase() || null : rest || null);
    }
    let fn = null, rest = t, arg = null;
    if (FN[t[t.length - 1]]) { fn = t[t.length - 1]; rest = t.slice(0, -1); }
    else if (t.length > 1 && FN[t[0]]) { fn = t[0]; rest = t.slice(1); }
    if (fn === 'COMP') return this.go('COMP', null, { list: [resolve(rest) || this.cur?.sec || '^GSPC', '^GSPC'].filter((v, i, a) => a.indexOf(v) === i), rg: '1Y' });
    if (fn && !FN[fn].r) return this.msg(FN[fn].d);
    if (fn && !FN[fn].sec) return this.go(fn, null, rest.join(' ') || null);
    let sec = rest.length ? resolve(rest) : null;
    if (rest.length && !sec) return this.go('SECF', null, rest.join(' '));
    if (fn) {
      if (FN[fn].sec) {
        sec = sec || this.cur?.sec;
        if (!sec) return this.msg(`${fn} requires a security — e.g. AAPL US EQUITY ${fn} <GO>`);
      }
      if (sec && !FN[fn].sec) sec = null;
      if (sec && (await quoteCheck(sec)) === false) return this.go('SECF', null, rest.join(' ') || sec);
      return this.go(fn, sec, arg);
    }
    // Security only
    if ((await quoteCheck(sec)) === false) return this.go('SECF', null, rest.join(' '));
    this.go(isEquity(sec) ? 'DES' : 'GP', sec);
  }
  // ---- autocomplete
  suggest() {
    const v = this.inp.value.toUpperCase();
    const last = v.trim().split(/\s+/).pop() || '';
    this.acSel = -1;
    if (!last) { this.ac.classList.remove('show'); return; }
    const items = [];
    for (const [k, f] of Object.entries(FN)) if (f.d && k.startsWith(last)) items.push({ k, d: f.d, type: 'fn' });
    const seen = new Set();
    for (const [code, c] of Object.entries(CODE)) {
      if ((code.startsWith(last) || c.name.toUpperCase().includes(last)) && !seen.has(c.y) && items.length < 10) { seen.add(c.y); items.push({ k: `${code} ${c.yk.toUpperCase()}`, d: c.name, type: 'sec', y: c.y }); }
    }
    this.acItems = items.slice(0, 10);
    const q = v.trim();
    if (q.length >= 2 && !FN[q]) {
      clearTimeout(this._acT);
      this._acT = setTimeout(() => api('search?q=' + encodeURIComponent(q) + '&quotes=8').then(r => {
        if (this.inp.value.toUpperCase().trim() !== q) return;
        const extra = r.quotes.filter(x => !seen.has(x.sym)).map(x => ({ k: disp(x.sym).toUpperCase(), d: `${x.name} · ${x.exch} · ${x.type}`, type: 'sec', y: x.sym }));
        this.acItems = [...this.acItems.filter(i => i.type === 'fn'), ...this.acItems.filter(i => i.type === 'sec'), ...extra].slice(0, 12);
        this.drawAc();
      }).catch(() => { }), 220);
    }
    this.drawAc();
  }
  drawAc() {
    if (!this.acItems?.length || document.activeElement !== this.inp) { this.ac.classList.remove('show'); return; }
    this.ac.innerHTML = this.acItems.map((it, i) => `<div data-i="${i}" class="${i === this.acSel ? 'sel' : ''}"><span class="k">${esc(it.k)}</span><span class="d">${esc(it.d)}</span></div>`).join('');
    this.ac.classList.add('show');
    $$('div', this.ac).forEach(d => d.onmousedown = e => { e.preventDefault(); this.pick(+d.dataset.i); });
  }
  pick(i) {
    const it = this.acItems[i]; if (!it) return;
    const toks = this.inp.value.trim().split(/\s+/); toks.pop();
    if (it.type === 'fn') { this.inp.value = ''; this.ac.classList.remove('show'); this.run([...toks, it.k].join(' ')); }
    else { this.inp.value = ''; this.ac.classList.remove('show'); this.run(it.y ? (REV[it.y] ? it.k : it.y) : it.k); }
  }
  key(e) {
    const acOpen = this.ac.classList.contains('show');
    if (e.key === 'Enter') {
      e.preventDefault();
      if (acOpen && this.acSel >= 0) return this.pick(this.acSel);
      const v = this.inp.value; this.inp.value = ''; this.ac.classList.remove('show'); this.chi = -1;
      if (!v.trim()) return;
      this.run(v);
    } else if (e.key === 'Escape') {
      this.inp.value = ''; this.ac.classList.remove('show'); this.chi = -1;
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const d = e.key === 'ArrowDown' ? 1 : -1;
      if (acOpen) { this.acSel = Math.max(-1, Math.min(this.acItems.length - 1, this.acSel + d)); this.drawAc(); }
      else if (this.cmdHist.length) { this.chi = Math.max(-1, Math.min(this.cmdHist.length - 1, this.chi - d)); this.inp.value = this.chi >= 0 ? this.cmdHist[this.chi] : ''; }
    } else if (e.key === 'Tab' && acOpen && this.acSel >= 0) {
      e.preventDefault(); this.pick(this.acSel);
    }
  }
}
function setActive(i, focus) {
  active = i;
  PANELS.forEach((p, j) => p.el.classList.toggle('active', j === i));
  if ($('#grid').classList.contains('l1')) PANELS.forEach(p => p.el.classList.contains('active') && requestAnimationFrame(() => $$('canvas', p.el).forEach(drawChart)));
  if (focus) PANELS[i].inp.focus();
}
function setLayout(l) {
  const g = $('#grid');
  const cur = ['l1', 'l2', 'l4'].find(c => g.classList.contains(c));
  if (cur && cur !== 'l1') store.set('layout.prev', cur);
  g.className = l; store.set('layout', l);
  $$('.layouts button').forEach(b => b.classList.toggle('on', b.dataset.layout === l));
  if (l === 'l2' && active > 1) setActive(0);
}

/* =====================================================================
   Chrome: clocks, keys, tape, global keyboard
   ===================================================================== */
const CLOCKS = [['NY', 'America/New_York'], ['LDN', 'Europe/London'], ['HK', 'Asia/Hong_Kong'], ['TYO', 'Asia/Tokyo']];
// Regular trading sessions (local exchange time); holidays are not modelled.
const MKTS = [['NYSE', 'America/New_York', 570, 960, 240, 1200], ['LSE', 'Europe/London', 480, 990], ['XETRA', 'Europe/Berlin', 540, 1050], ['HKEX', 'Asia/Hong_Kong', 570, 960], ['TSE', 'Asia/Tokyo', 540, 930]];
function mktState(tz, open, close, pre, post) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  if (p.weekday === 'Sat' || p.weekday === 'Sun') return 'closed';
  const m = +p.hour * 60 + +p.minute;
  if (m >= open && m < close) return 'open';
  if (pre != null && m >= pre && m < post) return 'ext';
  return 'closed';
}
function clocks() {
  const d = new Date();
  $('#clocks').innerHTML = `<span><b>${d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' })}</b></span>` +
    CLOCKS.map(([n, tz]) => `<span>${n} <b>${d.toLocaleTimeString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' })}</b></span>`).join('');
  $('#mkts').innerHTML = MKTS.map(([n, tz, o, c, pre, post]) => {
    const st = mktState(tz, o, c, pre, post);
    return `<span class="mkt ${st}" title="${n}: ${st === 'open' ? 'open' : st === 'ext' ? 'extended hours' : 'closed'} (holidays not shown)"><i></i>${n}</span>`;
  }).join('');
}
const KEYS = [['F1', 'HELP', 'm'], ['F2', 'GOVT'], ['F3', 'CORP'], ['F4', 'MTGE'], ['F5', 'M-MKT'], ['F6', 'MUNI'], ['F7', 'PFD'], ['F8', 'EQUITY'], ['F9', 'CMDTY'], ['F10', 'INDEX'], ['F11', 'CRNCY'], ['', 'MENU', 'm'], ['', 'CANCEL', 'r'], ['', 'GO', 'g']];
const FKEY = { F2: 'GOVT', F3: 'CORP', F4: 'MTGE', F5: 'M-MKT', F6: 'MUNI', F7: 'PFD', F8: 'EQUITY', F9: 'COMDTY', F10: 'INDEX', F11: 'CURNCY' };
function pressKey(label) {
  const p = PANELS[active];
  if (label === 'GO') { const v = p.inp.value; p.inp.value = ''; p.ac.classList.remove('show'); v.trim() ? p.run(v) : p.msg('Enter a command'); return; }
  if (label === 'CANCEL') { p.inp.value = ''; p.ac.classList.remove('show'); return p.inp.focus(); }
  if (label === 'MENU') return p.back();
  if (label === 'HELP') return p.go('HELP');
  const yk = { CMDTY: 'COMDTY', CRNCY: 'CURNCY' }[label] || label;
  p.inp.value = p.inp.value.trim() + ' ' + yk + ' ';
  p.inp.focus();
}
const LAUNCH = ['EDGE', 'WEI', 'MOST', 'INSB', 'UOA', 'WIRP', 'PRED', 'SENT', 'ECO', 'OIL', 'SHIP', 'TANK', 'TOP', 'HELP'];
function buildChrome() {
  $('#launch').innerHTML = LAUNCH.map(f => `<button data-f="${f}" title="${esc(FN[f].d)}">${f}</button>`).join('');
  $('#launch').onclick = e => { const b = e.target.closest('[data-f]'); if (b) PANELS[active].run(b.dataset.f); };
  $('#keys').innerHTML = KEYS.map(([f, l, c]) => `<button class="key ${c || ''}" data-key="${l}">${f ? `<small>${f}</small>` : ''}${l}</button>`).join('');
  $('#keys').onclick = e => { const b = e.target.closest('[data-key]'); if (b) pressKey(b.dataset.key); };
  const item = y => `<span class="it" data-y="${esc(y)}"><b>${esc(shortOf(y))}</b>${L(y, 'price')} ${L(y, 'pct')}</span>`;
  const one = TAPE.map(item).join('');
  $('#tapeInner').innerHTML = one + one;
  $('#tapeInner').onclick = e => { const it = e.target.closest('[data-y]'); if (it) PANELS[active].run(disp(it.dataset.y) + ' GP'); };
  $$('.layouts button').forEach(b => b.onclick = () => setLayout(b.dataset.layout));
}
document.addEventListener('keydown', e => {
  const p = PANELS[active];
  if (!p) return;
  if (e.key === 'F1') { e.preventDefault(); return p.go('HELP'); }
  if (FKEY[e.key]) { e.preventDefault(); p.inp.value = p.inp.value.trim() + ' ' + FKEY[e.key] + ' '; p.inp.focus(); return; }
  if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); return setActive(+e.key - 1, true); }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); return p.back(); }
  const inField = e.target.matches('input,select,textarea');
  if (e.key === 'Tab' && (!inField || e.target.classList.contains('cmd')) && !p.ac.classList.contains('show')) {
    e.preventDefault();
    const vis = PANELS.filter(x => getComputedStyle(x.el).display !== 'none').map(x => x.i);
    const k = vis.indexOf(active);
    return setActive(vis[(k + (e.shiftKey ? vis.length - 1 : 1)) % vis.length], true);
  }
  if (!inField && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) p.inp.focus();
  if (!inField && e.key === 'Escape') { p.inp.value = ''; }
  if (!inField && (e.key === 'PageDown' || e.key === 'PageUp')) { p.body.scrollBy(0, (e.key === 'PageDown' ? 1 : -1) * p.body.clientHeight * 0.9); e.preventDefault(); }
});

/* =====================================================================
   Boot
   ===================================================================== */
buildChrome();
clocks(); setInterval(clocks, 1000);
const grid = $('#grid');
for (let i = 0; i < 4; i++) {
  const p = new Panel(i);
  PANELS.push(p);
  grid.appendChild(p.el);
}
setLayout(store.get('layout', 'l4'));
PANELS.forEach((p, i) => {
  const s = store.get('panel' + i, null);
  const st = s && FN[s.fn] && FN[s.fn].r ? s : DEFAULTS[i];
  try { p.go(st.fn, st.sec, st.arg, false); } catch (e) { console.error(e); p.go(DEFAULTS[i].fn, DEFAULTS[i].sec, null, false); }
});
setActive(0, true);
poll();
</script>
</body>
